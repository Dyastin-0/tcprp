global_rate_limit:
  rate: 50
  burst: 100
  cooldown: 10
proxies:
  default:
    target: "wormhole:8889"
    terminate: false
    rate_limit:
      rate: 20
      burst: 25
      cooldown: 5
 
  pprof.wormhole.dyastin.dev:
    target: "wormhole:7060"
    terminate: true
    proto: http

  dyastin.dev:
    target: "blog-ui:3111"
    terminate: true
    proto: http
    routes:
      - pattern: "/api/v1/*"
        target: "blog-api:8081"

  grafana.dyastin.dev:
    target: "localhost:3000"   
    terminate: true
    proto: http

  '*.wormhole.dyastin.dev':
    target: "wormhole:8889"
    rate_limit:
      rate: 20
      burst: 25
      cooldown: 5

  echos.dyastin.dev:
    target: "echosf:42020"
    terminate: true
    proto: http
    routes:
      - pattern: "/api/*"
        target: "echos:8080"

  wormhole.dyastin.dev:
    target: "wormhole:8881"
    terminate: true
    rate_limit:
      rate: 5
      burst: 10
      cooldown: 10

  atlas.dyastin.dev:
    target: "atlas-ui:8111"
    terminate: true
    proto: http
    routes:
      - pattern: "/api/*"
        target: "atlas:8082"   
        rewrite:
          from: "^/api/ws"
          to: "/ws"
    rate_limit:
      rate: 20
      burst: 40
      cooldown: 5
